<span class="type">Definition</span><span class="space"> </span><span class="codenumber">9.5</span><span class="period">.</span>
</h3>In an <dfn class="terminology">instant run-off</dfn>, the total number of first place votes are counted for each candidate. The candidate with the least number of first place votes is removed from all ballots. This process is repeated until only one candidate remains, who is declared the winner.</article><span class="incontext"><a href="VotingTheory.html#definition-30" class="internal">in-context</a></span>
