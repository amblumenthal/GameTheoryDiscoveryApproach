<div class="para">Nim is an impartial game in which a position consists of <span class="process-math">\(\ell\)</span> piles of stones of sizes <span class="process-math">\(a_1,a_2,\dots,a_\ell\text{.}\)</span> To make a move, a player removes one or more (up to all) stones from a chosen pile. The last player to take a stone wins.</div>
